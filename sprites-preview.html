<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vorschau: Figuren und Icons</title>
    <link rel="stylesheet" href="./css/characters.css">
    <style>
      :root {
        --parchment: #f5e8c8;
        --ink: #2f2418;
        --frame: #55402a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 1.5rem;
        background: #e9d9b4;
        color: var(--ink);
        font-family: system-ui, sans-serif;
      }
      h1 { margin: 0 0 1rem; font-size: 1.4rem; }
      h2 { margin: 0 0 0.75rem; font-size: 1.1rem; }
      h3 { margin: 0.75rem 0 0.4rem; font-size: 0.9rem; color: #6b5536; }
      .card {
        margin-bottom: 1.25rem;
        padding: 1rem;
        border: 3px solid var(--frame);
        background: var(--parchment);
        box-shadow: 4px 4px 0 #9c8053;
      }
      .pose-row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 1rem 1.25rem;
      }
      .pose {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.75rem;
      }
      .pose-frame {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        border-bottom: 2px dashed #b89c6c;
      }
      .live {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 1rem;
        margin-top: 0.5rem;
      }
      .live-stage {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        min-width: 16rem;
        min-height: 15rem;
        border: 2px solid #b89c6c;
        background: #fbf3df;
      }
      .live-buttons { display: flex; flex-wrap: wrap; gap: 0.4rem; max-width: 30rem; }
      .live-buttons button {
        padding: 0.3rem 0.6rem;
        border: 2px solid var(--frame);
        background: #f4e3b9;
        font: inherit;
        font-size: 0.8rem;
        cursor: pointer;
      }
      .live-buttons button[aria-pressed="true"] { background: #d9c08e; }
      .icon-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
        gap: 0.75rem;
      }
      .icon-sample {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        padding: 0.5rem;
        border: 2px solid #d4bd8f;
        background: #fbf3df;
        font-size: 0.8rem;
      }
      .icon-sizes { display: flex; align-items: flex-end; gap: 0.75rem; }
      .icon-sizes img { display: block; image-rendering: pixelated; }
      .size-label { display: flex; flex-direction: column; align-items: center; gap: 0.15rem; color: #6b5536; }
    </style>
  </head>
  <body>
    <h1>Vorschau: Figuren und Icons</h1>
    <div id="characters"></div>
    <section class="card" aria-labelledby="icons-title">
      <h2 id="icons-title">Icons (assets/icons/)</h2>
      <div id="icons" class="icon-grid"></div>
    </section>

    <script type="module">
      import { CHARACTER_NAMES, CHARACTER_POSES, createCharacterSprite } from "./js/characters.js";
      import { ICON_NAMES, iconUrl } from "./js/icons.js";
      import { TEXTS } from "./js/texts.js";

      function el(tag, className = "", text = "") {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
      }

      const container = document.querySelector("#characters");
      for (const character of CHARACTER_NAMES) {
        const card = el("section", "card");
        card.append(el("h2", "", `${TEXTS.characterNames[character]} (${character})`));

        for (const scale of [2, 3]) {
          card.append(el("h3", "", `Alle Posen, ${scale}×`));
          const row = el("div", "pose-row");
          for (const pose of CHARACTER_POSES) {
            const item = el("div", "pose");
            const frame = el("div", "pose-frame");
            const sprite = createCharacterSprite(character, { pose, scale });
            frame.append(sprite.element);
            // In der Übersicht soll jede Pose ihren vollen Platz bekommen, ohne Nachbarn zu überdecken.
            sprite.ready.then(() => {
              sprite.element.classList.remove("wippen");
              sprite.element.style.width = sprite.image.style.width;
              sprite.element.style.height = sprite.image.style.height;
              sprite.element.classList.remove("points-right");
            });
            item.append(frame, el("span", "", pose));
            row.append(item);
          }
          card.append(row);
        }

        card.append(el("h3", "", "Live: Pose wechseln (3×, unten bündig)"));
        const live = el("div", "live");
        const stage = el("div", "live-stage");
        const liveSprite = createCharacterSprite(character, { pose: "ruhe", scale: 3 });
        stage.append(liveSprite.element);
        const buttons = el("div", "live-buttons");
        for (const pose of CHARACTER_POSES) {
          const button = el("button", "", pose);
          button.type = "button";
          button.setAttribute("aria-pressed", String(pose === "ruhe"));
          button.addEventListener("click", () => {
            buttons.querySelectorAll("button").forEach((other) => other.setAttribute("aria-pressed", "false"));
            button.setAttribute("aria-pressed", "true");
            void liveSprite.setPose(pose);
          });
          buttons.append(button);
        }
        live.append(stage, buttons);
        card.append(live);
        container.append(card);
      }

      const grid = document.querySelector("#icons");
      for (const name of ICON_NAMES) {
        const sample = el("div", "icon-sample");
        const sizes = el("div", "icon-sizes");
        const probe = new Image();
        probe.src = iconUrl(name);
        probe.onload = () => {
          for (const scale of [1, 2, 3]) {
            const label = el("span", "size-label");
            const image = new Image();
            image.src = probe.src;
            image.alt = "";
            image.width = probe.naturalWidth * scale;
            image.height = probe.naturalHeight * scale;
            label.append(image, el("span", "", `${scale}×`));
            sizes.append(label);
          }
          sample.querySelector(".icon-size-note").textContent = `${probe.naturalWidth} × ${probe.naturalHeight} px`;
        };
        sample.append(sizes, el("strong", "", name), el("span", "icon-size-note"));
        grid.append(sample);
      }
    </script>
  </body>
</html>
